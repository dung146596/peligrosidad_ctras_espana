version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: dgt_postgis
    environment:
      POSTGRES_DB: dgt_risk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: